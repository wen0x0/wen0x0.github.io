<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  
  <title>404</title>
  
  <link rel="icon" type="image/png" sizes="32x32" href="https://wen.is-a.dev/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://wen.is-a.dev/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://wen.is-a.dev/img/apple-touch-icon.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Ancizar+Sans:ital,wght@0,100..1000;1,100..1000&family=Bitter:ital,wght@0,100..900;1,100..900&family=Indie+Flower&family=Lora:ital,wght@0,400..700;1,400..700&family=Marcellus&display=swap"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500..700&display=swap" rel="stylesheet">
  
  <style>
  /* Light mode */
  body {
    --primary-color: #005e05;
    --primary-pale-color: #5871a233;
    --primary-decoration-color: #02020210;

    --bg-color: #F7FAF7;
    --text-color: #26373a;
    --text-pale-color: #0f5f63;
    --text-decoration-color: #a9a9a9;

    --highlight-mark-color: #5f75b020;

    --callout-note-color: #5871a2;
    --callout-tip-color: #268556;
    --callout-important-color: #885fc9;
    --callout-warning-color: #ab6632;
    --callout-caution-color: #c64e4e;

    /* Typography and layout */
    --main-font:
      Nunito, ui-sans-serif, system-ui, Inter, sans-serif,
      "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol",
      "Noto Color Emoji";

    --heading-font:
      "Quicksand", "Lora", "Bitter", ui-sans-serif, system-ui, sans-serif,
      "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol",
      "Noto Color Emoji";

    --code-font:
      "Cascadia Code", "Fira Code", ui-monospace, SFMono-Regular, Menlo,
      Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

    --homepage-max-width: 800px;
    --main-max-width: 800px;
    --avatar-size: 75px;
    --font-size: 16px;
    --line-height: 1.75;

    --img-border-radius: 0;
    --detail-border-radius: 11px;
    --inline-code-border-radius: 2px;
    --block-code-border-radius: 0;

    --dark-mode-img-brightness: 0.75;
    --dark-mode-chart-brightness: 0.75;

    --inline-code-bg-color: var(--primary-decoration-color);
    --block-code-border-color: var(--primary-color);
    --detail-border-color: var(--primary-color);
  }

  /* Dark mode */
  body.dark {
    --primary-color: #7cff7c;
    --primary-pale-color: #6f8fd166;
    --primary-decoration-color: #717172a9;

    --bg-color: #1c2829;
    --text-color: #d9f3f1;
    --text-pale-color: #ffffff;
    --text-decoration-color: #5f5f5f;

    --highlight-mark-color: #8296cb3b;

    --callout-note-color: #6f8fd1;
    --callout-tip-color: #47976f;
    --callout-important-color: #9776cd;
    --callout-warning-color: #ad7a52;
    --callout-caution-color: #d06161;
  }

  /* Typography */
  #name,
  #id,
  #left,
  a.post,
  a.back-link,
  a.tag,
  a.category,
  .title {
    font-family: var(--heading-font);
  }

  span.date {
    color: var(--text-pale-color);
    font-weight: 100;
    font-family: var(--code-font);
  }

  /* Homepage GIF */
  .gif-wrapper {
    margin: 1.5rem 0;
    text-align: center;
  }

  .intro-gif {
    max-width: 96%;
    height: auto;
    border-radius: 8px;
  }

  /* Verified icon */
  .verified-icon {
    display: inline-flex;
    align-items: center;
    margin-bottom: 3px;
    vertical-align: middle;
  }

  .verified-icon svg {
    width: 16px;
    height: 16px;
  }

  /* Navigation */
  .top-nav {
    position: sticky;
    top: 0;
    z-index: 1000;

    width: 100%;
    height: auto;
    margin-top: 1em;
    padding-bottom: 1em;

    background: rgba(var(--background-rgb), 0.85);
    border: 1px solid var(--border-color);
    border-radius: var(--detail-border-radius);

    backdrop-filter: blur(8px);
  }

  .top-nav nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 40px;
  }

  .nav-left,
  .nav-center,
  .nav-right {
    display: flex;
    align-items: center;
  }

  .nav-center {
    flex: 1;
    justify-content: center;
  }

  .avatar {
    width: 32px;
    height: 32px;
    margin-top: 1em;
    border-radius: 50%;
  }

  /* Menu */
  .menu-wrapper {
    position: relative;
    margin-top: 1.5em;
  }

  .menu-trigger {
    color: var(--text-color);
    font-size: 1.5em;
    background: transparent;
    border: 0;
    cursor: pointer;
  }

  .menu-dropdown {
    position: absolute;
    top: 100%;
    right: 0;
    z-index: 2000;

    display: flex;
    flex-direction: column;
    min-width: 85px;
    padding: 0.25em 0;

    background: var(--bg-color);
    border: 1px solid var(--primary-pale-color);
    border-radius: 8px;
    box-shadow: 0 4px 12px rgb(0 0 0 / 15%);

    opacity: 0;
    pointer-events: none;
    transform: translateY(-10px);
    transition:
      opacity 0.25s ease,
      transform 0.25s ease;
  }

  .menu-wrapper.active .menu-dropdown {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .menu-dropdown a {
    display: block;
    margin: auto;
    padding: 0.6em 1em;

    color: var(--text-color);
    font-family: var(--heading-font);
    font-size: 0.95em;
    text-decoration: none;

    transition:
      background 0.2s ease,
      color 0.2s ease;
  }

  #theme-toggle:hover,
  #rain-toggle:hover {
    cursor: pointer;
  }

  /* Titles and quotes */
  .foot-quote,
  .section-title {
    display: block;
    margin-top: 2em;

    font-family: "Lora", serif;
    font-style: italic;
    text-align: center;
  }

  .section-title {
    margin-top: 0;
  }

  .year-heading {
    margin-top: 1.5em;
    margin-bottom: 0.5em;

    font-family: var(--heading-font);
    font-size: 1.5em;
    font-weight: bold;
  }

  /* Post list */
  .layout-list .post {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1em;
  }

  .post>span:first-child {
    flex: 1;
    min-width: 0;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .post>.date {
    flex-shrink: 0;
    white-space: nowrap;
  }

  span.title {
    font-weight: bold;
  }

  /* Terminal caret */
  #id.term-caret {
    position: relative;

    font-family: var(--code-font);
    white-space: nowrap;
  }

  #id.term-caret::after {
    content: "_";
    margin-left: 4px;

    color: currentColor;
    opacity: 1;
    animation: blink 1s steps(1, end) infinite;
  }

  @keyframes blink {
    50% {
      opacity: 0;
    }
  }

  /* Typewriter */
  #id.typewriter {
    font-family: var(--code-font);
    white-space: nowrap;

    border-right: 1ch solid currentColor;
    animation: caret-blink 1s steps(1, end) infinite;
  }

  @keyframes caret-blink {
    50% {
      border-right-color: transparent;
    }
  }

  /* Glitch effect */
  #id.glitch {
    position: relative;
    display: inline-block;
    font-family: var(--heading-font);
  }

  #id.glitch::before,
  #id.glitch::after {
    position: absolute;
    top: 0;
    left: 0;

    content: attr(data-text);
    clip-path: inset(0 0 0 0);
    opacity: 0.85;
  }

  #id.glitch::before {
    text-shadow: 1px 0 0 #f00;
    mix-blend-mode: screen;
    animation: glitch-1 2s infinite linear alternate-reverse;
  }

  #id.glitch::after {
    text-shadow: -1px 0 0 #0ff;
    mix-blend-mode: screen;
    animation: glitch-2 2.2s infinite linear alternate-reverse;
  }

  @keyframes glitch-1 {
    0% {
      clip-path: inset(0 0 85% 0);
      transform: translate(0, 0);
    }

    20% {
      clip-path: inset(10% 0 60% 0);
      transform: translate(-1px, -1px);
    }

    40% {
      clip-path: inset(40% 0 30% 0);
      transform: translate(1px, 1px);
    }

    60% {
      clip-path: inset(20% 0 55% 0);
      transform: translate(-1px, 0);
    }

    80% {
      clip-path: inset(70% 0 5% 0);
      transform: translate(0, 1px);
    }

    100% {
      clip-path: inset(0 0 85% 0);
      transform: translate(0, 0);
    }
  }

  @keyframes glitch-2 {
    0% {
      clip-path: inset(70% 0 5% 0);
      transform: translate(0, 0);
    }

    20% {
      clip-path: inset(40% 0 30% 0);
      transform: translate(1px, 0);
    }

    40% {
      clip-path: inset(10% 0 60% 0);
      transform: translate(0, -1px);
    }

    60% {
      clip-path: inset(0 0 85% 0);
      transform: translate(-1px, 1px);
    }

    80% {
      clip-path: inset(20% 0 55% 0);
      transform: translate(1px, 0);
    }

    100% {
      clip-path: inset(70% 0 5% 0);
      transform: translate(0, 0);
    }
  }

  /* Accessibility */
  @media (prefers-reduced-motion: reduce) {
    #id.term-caret::after {
      animation: none;
    }

    #id.typewriter {
      animation: none;
      border-right-color: currentColor;
    }

    #id.glitch::before,
    #id.glitch::after {
      animation: none;
    }
  }

  /* Entry image */
  .entry-image {
    width: 100%;
    padding: 0 15px;
    margin: 1rem 0 2rem;
  }

  .entry-image img {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 1;
    object-fit: cover;
    border-radius: 18px;
    transition:
      transform 0.25s ease,
      box-shadow 0.25s ease;
  }

  /* Mobile */
  @media (max-width: 600px) {
    .entry-image {
      margin: 1.25rem 0 1.75rem;
    }

    .entry-image img {
      aspect-ratio: 1.8 / 1;
      border-radius: 14px;
    }
  }

  /* turn off animation */
  @media (prefers-reduced-motion: reduce) {
    .entry-image img {
      transition: none;
    }

    .entry-image img:hover {
      transform: none;
    }
  }
</style>

</head>

<body class="not-found">

  
  <script>
    const theme = sessionStorage.getItem('theme');
    const match = window.matchMedia("(prefers-color-scheme: dark)").matches;
    if ((theme && theme === 'dark') || (!theme && match)) {
      document.body.classList.add('dark');
      const hl = document.querySelector('link#hl');
      if (hl) hl.href = 'https://wen.is-a.dev/hl-dark.css';
    }
  </script>
  

  
<div class="wrapper">
  <p class="error">
    404 Not Found
  </p>
  <a class="instant" href="https://wen.is-a.dev">« back to home »</a>
</div>

  

  <script src="https://wen.is-a.dev/js/main.js"></script>
</body>
